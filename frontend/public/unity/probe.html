<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agentic Soccer - Replay Client - DIAGNOSTIC</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;color:#cfd6e4;font-family:system-ui,"Segoe UI",sans-serif}
  #wrap{display:flex;flex-direction:column;height:100%}
  #bar{padding:6px 12px;font-size:12px;background:#121722;border-bottom:1px solid #222a38;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #bar input{background:#0b0e13;border:1px solid #2a3346;color:#cfd6e4;border-radius:4px;padding:2px 6px}
  #status{color:#8ba0c4}
  #unity-canvas{flex:1;width:100%;background:#000;display:block;min-height:120px}
  #logs{position:fixed;right:0;bottom:0;width:46vw;height:42vh;margin:0;overflow:auto;
        background:rgba(6,9,14,.94);border-left:1px solid #222a38;border-top:1px solid #222a38;
        color:#9fe3b0;font:11px/1.45 ui-monospace,Consolas,monospace;padding:6px 8px;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span>matchId</span><input id="matchId" size="40" value="1dfddd08-333a-48d8-8571-1af248d6cbfa"/>
    <span>server</span><input id="server" size="40" value="wss://game.agentic-football.aws.dev"/>
    <span id="status">capture on</span>
  </div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<pre id="logs">=== diagnostic capture ===</pre>
<script>
(function () {
  var LOGS = [];
  var el = document.getElementById('logs');
  function push(s) {
    LOGS.push(s);
    if (el) { el.textContent = LOGS.join('\n'); el.scrollTop = el.scrollHeight; }
  }
  window.__LOGS = LOGS;
  var orig = {};
  ['log','warn','error','info','debug'].forEach(function (k) {
    orig[k] = console[k].bind(console);
    console[k] = function () {
      var a = Array.prototype.slice.call(arguments).map(function (x) {
        try { return typeof x === 'string' ? x : JSON.stringify(x); } catch (e) { return String(x); }
      }).join(' ');
      push('[' + k + '] ' + a);
      orig[k].apply(null, arguments);
    };
  });
  window.addEventListener('error', function (e) {
    push('[onerror] ' + e.message + '  @' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    push('[unhandledrejection] ' + ((e.reason && e.reason.message) || e.reason));
  });

  // ---- network capture + replay downloadUrl rewrite ----
  // 官方 presigned S3 URL 任何 Origin 都没有 ACAO → 浏览器直连必被拦。
  // 改走本机 /__rproxy: 由本地服务在服务端取回"原样 gzip 字节"再吐出,
  // 既绕开 CORS, 也不带 Content-Encoding (客户端自己会 gunzip)。
  var _fetch = window.fetch;
  window.fetch = function (input, init) {
    var url = (typeof input === 'string') ? input : (input && input.url) || '';
    // 队伍 logo 托管在 cloudfront, 同样没有 ACAO → 也改走本地代理
    var viaProxy = /^https?:\/\/[^\/]*cloudfront\.net\//i.test(url);
    if (viaProxy) {
      var pu = location.origin + '/__rproxy?u=' + encodeURIComponent(url);
      push('[fetch>] ' + url + '  (via rproxy)');
      return _fetch.call(this, pu, init).then(function (r) {
        push('[fetch<] ' + r.status + '  ' + url + '  (proxied)');
        return r;
      }, function (e) { push('[fetch!] ' + url + '  :: ' + e); throw e; });
    }
    push('[fetch>] ' + url);
    return _fetch.apply(this, arguments).then(function (r) {
      var m = /^(https?:\/\/[^\/]+)\/match\/([^\/]+)\/replay\/info/.exec(url);
      if (m && r.ok) {
        return r.text().then(function (txt) {
          var j = null;
          try { j = JSON.parse(txt); } catch (e) { /* keep raw */ }
          if (j && j.downloadUrl) {
            var relayUrl = m[1] + '/match/' + m[2] + '/replay';
            j.downloadUrl = location.origin + '/__rproxy?u=' + encodeURIComponent(relayUrl);
            push('[rewrite] downloadUrl -> ' + j.downloadUrl);
            txt = JSON.stringify(j);
          }
          return new Response(txt, {
            status: r.status, statusText: r.statusText,
            headers: { 'Content-Type': 'application/json' }
          });
        });
      }
      push('[fetch<] ' + r.status + ' ' + r.statusText + '  ' + url);
      return r;
    }, function (e) {
      push('[fetch!] ' + url + '  :: ' + e);
      throw e;
    });
  };
  var _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    push('[xhr>] ' + m + ' ' + u);
    this.addEventListener('load', function () { push('[xhr<] ' + this.status + '  ' + u); });
    this.addEventListener('error', function () { push('[xhr!] ' + u); });
    return _open.apply(this, arguments);
  };
  var _WS = window.WebSocket;
  function WS(url, protocols) {
    push('[ws>] ' + url);
    var s = protocols === undefined ? new _WS(url) : new _WS(url, protocols);
    s.addEventListener('open',    function () { push('[ws OPEN] ' + url); });
    s.addEventListener('close',   function (e) { push('[ws CLOSE] ' + url + '  code=' + e.code + ' reason=' + (e.reason || '')); });
    s.addEventListener('error',   function () { push('[ws ERROR] ' + url); });
    return s;
  }
  Object.getOwnPropertyNames(_WS).forEach(function (k) {
    try { WS[k] = _WS[k]; } catch (e) {}
  });
  WS.prototype = _WS.prototype;
  WS.CONNECTING = _WS.CONNECTING; WS.OPEN = _WS.OPEN; WS.CLOSING = _WS.CLOSING; WS.CLOSED = _WS.CLOSED;
  window.WebSocket = WS;
})();
</script>
<script src="asw-agentic-soccer-web.loader.js"></script>
<script>
window.__booted = false;
function boot() {
  if (window.__booted) return; window.__booted = true;
  var st = document.getElementById('status');
  var matchId = document.getElementById('matchId').value.trim();
  var server  = document.getElementById('server').value.trim();
  st.textContent = 'booting...';
  createUnityInstance(document.getElementById('unity-canvas'), {
    dataUrl: 'asw-agentic-soccer-web.data',
    frameworkUrl: 'asw-agentic-soccer-web.framework.js',
    codeUrl: 'asw-agentic-soccer-web.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'AWSAgenticSoccer',
    productName: 'asw-agentic-soccer-web',
    productVersion: '1.0',
    arguments: ['--matchId', matchId, '--server', server]
  }, function (p) { st.textContent = (p * 100).toFixed(1) + '%'; })
    .then(function (u) { st.textContent = 'loaded'; window.unityInstance = u; console.log('[boot] unity loaded'); })
    .catch(function (e) { st.textContent = 'ERROR'; console.error('[boot] ' + e); });
}
window.addEventListener('load', function () { setTimeout(boot, 50); });
</script>
</body>
</html>
